name: Build DSH

# ── 分支 = 通道 ─────────────────────────────────────────────────────────────
#   dev（默认分支）—— 跟随上游最新的预发布通道
#     · schedule（每天 06:00 UTC，GitHub 的 schedule **只在该仓库的默认分支上触发**）
#     · 目标上游 = master 头；发布到 dsh-dev-latest（pre-release）
#     · 发布成功后把这次的上游提交写进 portable/upstream.pin 并提交（见下）
#   main —— 稳定通道
#     · 只在 main 被推进时触发（push，路径过滤）或手动 dispatch
#     · 目标上游 = portable/upstream.pin 里钉住的那个提交 —— 只有晋升时才动
#     · 发布到 dsh-master-latest（正式）
#   通道由**你所在的分支**决定，不再由事件类型猜测：
#     在 dev 上（含每日 schedule）→ dsh-dev-latest；在 main 上 → dsh-master-latest；
#     在临时分支上手动 dispatch → 按 dev 通道跑（用于验证，不会碰稳定标签）。
#
# ── 上游 pin：稳定通道可复现 ───────────────────────────────────────────────
#   portable/upstream.pin 是一行 40 位上游 commit sha，含义是「本通道当前产物对应的上游提交」。
#   · dev：每次成功发布后才推进到当天的上游 master 头 —— 所以 pin == 已发布的产物，
#          不会出现「pin 指向 A、线上是 B」的错位；它同时是下次 schedule 的跳过判据。
#   · main：只在晋升（把 dev 合过来）时更新 —— 于是 dsh-master-latest 永远是某个**确定的**
#          上游提交的产物，随时可以重建；不再出现「当时的上游 HEAD 是什么就是什么」。
#   跳过判定只对自动触发（schedule / push）生效；手动 dispatch 一律构建。
#
# ── 晋升路径 ───────────────────────────────────────────────────────────────
#   dev 验证 OK → gh pr create --base main --head dev → 合并 → main 上的 push 自动重建稳定版
#   （diff 只有胶水 + 一行 pin，可 review）。
#
# ── 本地修复与产物 ─────────────────────────────────────────────────────────
#   本地补丁：portable/patch-native-code.mjs 在构建产物上应用两处（幂等、可自愈，上游修了自动跳过）：
#     1. hasIntrinsicConstructor 的 toString 空白归一化（浏览器 lossless-JSON 守卫）
#     2. session 迁移白名单补历史 kind "instruction-hint"：改动点只有 v2→v3 的白名单
#        （v3→v4 无此白名单），覆盖面是整条 v2→v3→v4 链 —— v2 会话必须先过 v2→v3，
#        故它同时是「会话批量迁移到 v4」能 0 拒绝的前置条件。
#   会话迁移：portable/build-migrator.mjs 把上游 scripts/migrate-sessions-to-v4.ts 打成
#            portable/app/migrate-sessions-v4.mjs 随包分发；dsh.exe 启动时跑一次，
#            把本地 v2/v3 会话补迁移到 v4（上游只在 resume 时才升级）。
#   两个产物：
#     1. npm tarball 集合（ubuntu，官方 release:pack 链）
#     2. Windows 绿色便携包（windows，node 便携运行时 + hoisted 依赖 + dsh.exe + update.exe）
#   关键：下游所有 job 都用 check 解析出的**那个**上游 sha 检出上游，不用 master ——
#         否则 check 与真正构建的提交可能不是同一个（上游在 run 期间前进了）。

on:
  schedule:
    # 只会在默认分支（dev）上触发 —— 这也是 main 不会自动发稳定版的原因。
    - cron: "0 6 * * *"
  push:
    branches: [main]
    # 只有会改变产物的路径才重建稳定版；纯文档改动不惊动它。
    paths:
      - "portable/**"
      - "tests/**"
      - ".github/workflows/**"
  # 手动触发一律构建（不跳过）：临时分支上跑也走 dev 通道，用来验证流水线。
  workflow_dispatch: {}

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # pnpm 版本的单一事实来源。
  #
  # 为什么不是 12.x：pnpm 12.6.0（含 12.0–12.6 全线）在**工作区**里跑 `pnpm run <script>` 或
  # `pnpm exec` 必然失败 —— 它内部那次「依赖校验安装」会带上已被自己移除的旧选项
  # `verify-deps-before-run-install`，然后被自己的严格选项校验拒绝：
  #   [ERROR] Unknown option: 'verify-deps-before-run-install' ... pnpm help install
  # 已本地最小复现（`pnpm-workspace.yaml` 里只要有 `packages:` 就会触发），且 `--config.*`
  # 之类的外部覆盖救不了它（那次调用在 pnpm 进程内部，拿不到我们的命令行开关）。所以留在
  # 11.x 末版 11.27.1 —— 它包含我们要的修复，也认得这个旧选项。
  #
  # 为什么要升：上游 package.json 把 packageManager 钉在 pnpm@11.7.0，而 11.7.0 在
  # node-linker=hoisted 下有缺陷：把已构建的包复制到其它 hoisted 位置时整目录替换，连带删掉
  # 并发兄弟的 _tmp_* 暂存目录（pnpm#12880，11.25.0 修复）。症状是
  # ERR_PNPM_ENOENT rename '.../_tmp_...' -> '.../esbuild'；更糟的是替换本身是静默的，
  # 成功的那几次也会删掉目标下嵌套的 node_modules。11.27.1 > 11.25.0，已含修复。
  #
  # 配套的两个动作：
  #   1. 两个构建 job 都在 checkout 之后把 package.json 的 packageManager 对齐到本版本。
  #      - pnpm/action-setup@v6 会拿 version 输入与 packageManager 对账，不一致直接报
  #        "Multiple versions of pnpm specified"（v4 不检查），对齐后这一关自然过；
  #      - 对齐后 pnpm 不会再「自动下载并回退」到 11.7.0（默认 pmOnFail=download）——
  #        包括 `pnpm run` 内部触发的依赖校验安装，那次调用继承不到我们的命令行开关，
  #        钉不满足时会悄悄跑回 11.7.0，把 hoisted 缺陷带回来。
  #      - packageManager 只影响 pnpm 自身行为，不进任何产物：锁文件里没有
  #        packageManagerDependencies，该字段也不随包发布。
  #   2. 每次 pnpm 调用仍带 --pm-on-fail=ignore：它让 pnpm 不把 packageManagerDependencies
  #      写进 pnpm-lock.yaml，免得 --frozen-lockfile 因锁文件被改写而失败。
  #
  # 命令位置也讲究：`pnpm run <script> --flag` 的 --flag 会转交给脚本，要作用于 pnpm 必须写在
  # 脚本名之前。这里统一放在 `pnpm` 之后、子命令之前，最不容易踩坑。
  PNPM_VERSION: "11.27.1"

jobs:
  # -------- 解析目标上游提交 + 跳过判定 --------
  check:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      # dev 通道要读上游 master 头，所以这里检出的就是上游仓库
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0

      - name: Resolve target upstream commit
        id: resolve
        shell: bash
        run: |
          channel=dev
          tag=dsh-dev-latest
          if [ "${{ github.ref_name }}" = "main" ]; then channel=main; tag=dsh-master-latest; fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$channel" = "main" ]; then
            # 稳定通道：钉在 portable/upstream.pin 上（用 API 读，免得为读一行做一次 checkout）
            sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/portable/upstream.pin?ref=${{ github.sha }}" \
                   --jq '.content' | base64 -d | tr -d '[:space:]')"
            if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{40}$'; then
              echo "::error::portable/upstream.pin 不是 40 位 commit sha：'$sha'"
              exit 1
            fi
            if ! gh api "repos/deepseek-ai/deepseek-harness/commits/$sha" >/dev/null 2>&1; then
              echo "::error::upstream.pin 指向的提交在上游不存在：$sha"
              exit 1
            fi
            echo "🎯 main 通道：目标 = pin $sha"
          else
            # dev 通道：跟随上游 master 头
            sha="$(git rev-parse HEAD)"
            echo "🎯 dev 通道：目标 = 上游 master 头 $sha"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

          # 跳过判定：手动 dispatch 一律构建；schedule / push 在「目标 == 上次发布的上游提交」时跳过。
          # 上次发布的提交从 Release body 的 `upstream: <sha>` 行读（旧格式没有这行 → 不跳过）。
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🔨 手动触发：直接构建"
            exit 0
          fi
          body="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
                  "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag" | jq -r .body || true)"
          last="$(printf '%s' "$body" | sed -n 's/^upstream: \([0-9a-f]\{40\}\).*/\1/p')"
          if [ -n "$last" ] && [ "$last" = "$sha" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ $tag 已经是这个提交（$sha），跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "📦 $tag: ${last:-<无记录>} → $sha"
          fi

  # -------- npm tarball 集合（ubuntu） --------
  npm:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0

      # 把上游钉的 packageManager 对齐到我们要跑的 pnpm（理由见顶层 env 注释）
      - name: Align packageManager pin with the pnpm we run
        shell: bash
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.packageManager='pnpm@'+process.env.PNPM_VERSION;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n')"
          node -p "require('./package.json').packageManager"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # 打印实际生效的 pnpm：它已与 packageManager 对齐，任何回退都会在这里现形
      - name: Show toolchain versions
        run: |
          pnpm --version
          node --version

      - name: Install dependencies
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile

      - name: Build
        run: pnpm --pm-on-fail=ignore run build:official

      - name: Pack release tarballs
        run: pnpm --pm-on-fail=ignore run release:pack --family dsh --out dist/npm

      - name: Archive npm tarballs
        shell: bash
        run: |
          zip -r "dsh-npm-tarballs-${{ needs.check.outputs.short_sha }}.zip" dist/npm

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-npm-tarballs
          path: dsh-npm-tarballs-*.zip
          retention-days: 7

  # -------- Windows 绿色便携包 --------
  portable:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0

      # 二次 checkout 自己的仓库，取 portable/ 下的启动器与更新器源码。
      # 必须显式 ref：不带 ref 时 checkout 取的是仓库**默认分支**（现在是 dev），
      # 于是在 main 上跑 CI 时，_build_repo 里会是 dev 的胶水 —— 分支验证会失真。
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo

      # 把上游钉的 packageManager 对齐到我们要跑的 pnpm（理由见顶层 env 注释）
      - name: Align packageManager pin with the pnpm we run
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const j=JSON.parse(fs.readFileSync('package.json','utf8'));j.packageManager='pnpm@'+process.env.PNPM_VERSION;fs.writeFileSync('package.json',JSON.stringify(j,null,2)+'\n')"
          node -p "require('./package.json').packageManager"

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # 打印实际生效的 pnpm：它已与 packageManager 对齐，任何回退都会在这里现形
      - name: Show toolchain versions
        shell: pwsh
        run: |
          pnpm --version
          node --version

      - name: Install dependencies (hoisted)
        shell: pwsh
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile --config.node-linker=hoisted --config.allowUnusedPatches=true

      - name: Build
        shell: pwsh
        run: pnpm --pm-on-fail=ignore run build:official

      # 跑 patch-peers 单测（独立 fixtures，不依赖上游构建产物；本地改动先过测试再打包）
      - name: Run patch-peers tests
        shell: pwsh
        run: node _build_repo/tests/patch-peers.test.mjs
      # 跑 patch-native-code 单测（上下文转义 / 自愈 / 幂等，同一套独立 fixtures）
      - name: Run patch-native-code tests
        shell: pwsh
        run: node _build_repo/tests/patch-native-code.test.mjs

      # deploy 到 portable/app：把 @deepseek-ai/dsh 的包文件(lib/bin.js)放到 app 根，
      # 依赖(含 workspace 包)装进 app/node_modules。不加 --prod（dsh 运行时插件在
      # devDependencies，靠 cordis 动态加载）；不加 auto-install-peers=false。
      # 注意：pnpm deploy 要求目标目录为空（ERR_PNPM_DEPLOY_DIR_NOT_EMPTY），所以迁移器
      # 的构建必须排在 deploy 之后。
      - name: Deploy portable runtime
        shell: pwsh
        run: |
          # allowUnusedPatches：deploy 只取 @deepseek-ai/dsh 子集，上游 pnpm-workspace.yaml
          # 里的 macOS/desktop 补丁（@electron/osx-sign 等）不在子集内，pnpm 会报
          # ERR_PNPM_UNUSED_PATCH 使构建失败；该开关允许未使用的补丁（仅告警）。
          pnpm --pm-on-fail=ignore --filter @deepseek-ai/dsh deploy --legacy `
            --config.allowUnusedPatches=true `
            --config.node-linker=hoisted `
            --config.link-workspace-packages=true `
            portable/app

      # 会话代际迁移器：把上游 scripts/migrate-sessions-to-v4.ts 打成随包分发的单文件 ESM
      # （相对 import 内联，@deepseek-ai/* 保持 external 走 app/node_modules —— 迁移逻辑用的
      # 仍是上游自己的机器，不是我们重写的副本）。dsh.exe 启动时跑一次，把本地 v2/v3 会话
      # 补迁移到 v4。上游只在「写打开」(resume) 时才升级，不能指望用户逐条 resume。
      # 必须排在 deploy 之后：pnpm deploy 要求目标目录为空。
      - name: Build session migrator bundle
        shell: pwsh
        run: |
          node _build_repo\portable\build-migrator.mjs . portable\app\migrate-sessions-v4.mjs

      # deploy 会系统性漏掉 workspace 包之间的 peer 依赖（auto-install-peers 对
      # deploy 无效）。patch-peers.mjs 遍历 workspace 全部 @deepseek-ai 包，把缺失的
      # 补齐（复制 lib/ + package.json）。实测补 55 个包，--dump-default-config 全绿。
      - name: Patch missing workspace packages
        shell: pwsh
        run: |
          node _build_repo\portable\patch-peers.mjs . portable\app\node_modules\@deepseek-ai

      # schemastery 依赖 @standard-schema/spec（registry 包，非 workspace），从 install 结果复制
      - name: Patch registry peer (standard-schema)
        shell: pwsh
        run: |
          if (Test-Path "node_modules\@standard-schema\spec") {
            New-Item -ItemType Directory -Force "portable\app\node_modules\@standard-schema" | Out-Null
            Copy-Item "node_modules\@standard-schema\spec" "portable\app\node_modules\@standard-schema\spec" -Recurse -Force
          }

      # 体积优化：删 sourcemap + build 工具（编译/lint/打包器/hooks，运行时绝不 import）。
      # typescript 被 dsh-typert-generator（编译期生成器）依赖，但运行时无 import，可删。
      - name: Strip build tools and sourcemaps
        shell: pwsh
        run: |
          $nm = "portable\app\node_modules"
          Get-ChildItem $nm -Recurse -Filter "*.map" -File | Remove-Item -Force -ErrorAction SilentlyContinue
          $buildTools = @(
            'typescript','tsx','@esbuild','@rolldown','@oxlint','@oxlint-tsgolint',
            'lefthook','lefthook-windows-x64','lightningcss','lightningcss-win32-x64-msvc',
            '@babel','tsdown','vite','rollup','eslint','webpack','terser','prettier','oxc-resolver'
          )
          foreach ($t in $buildTools) {
            $p = Join-Path $nm $t
            if (Test-Path $p) { Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue }
          }

      # deploy 漏掉 workspace 包的 registry 依赖（实测 cordis-plugin-hmr 的
      # @babel/code-frame 没带上，HMR 插件运行时 import 它导致闪退）。
      # patch-dep.mjs 从 root node_modules 递归补齐缺失依赖链。
      - name: Patch runtime deps (deploy 漏的 registry 依赖)
        shell: pwsh
        run: |
          node _build_repo\portable\patch-dep.mjs node_modules portable\app\node_modules @babel/code-frame @deepseek-ai/schemastery

      # 应用本地修复（幂等、可自愈；上游修复后自动跳过）：
      # 1. hasIntrinsicConstructor 的 toString 精确比较在真实浏览器输出带换行，
      #    导致全对象被判非 lossless JSON、消息无法渲染 → 归一化空白后比较。
      #    （同一模式还以内联字符串字面量的形态出现在 dsh-workflow-ptc 里，按上下文多转义一层。）
      # 2. session v2→v3 迁移白名单缺历史 kind "instruction-hint"，
      #    含旧 AGENTS.md 提示消息的会话迁移报错、无法加载 → 补入白名单。
      #    这条同时是 v4 批量迁移能 0 拒绝的前提。
      - name: Apply local harness fixes (lossless-JSON guard + v3 migration kind)
        shell: pwsh
        run: |
          node _build_repo\portable\patch-native-code.mjs portable\app\node_modules\@deepseek-ai

      # 迁移器装载校验：--help 之前会先解析全部 import。这一步专门验证迁移器的 external
      # 依赖（cordis / dsh-session / format-catalog / persistence-jsonl …）确实落在
      # app/node_modules 里 —— 否则迁移器会在用户机器上启动即崩，而我们这里发现不了。
      - name: Smoke test session migrator (imports resolve)
        shell: pwsh
        run: |
          $env:DSH_BUILD_COMMIT = "${{ needs.check.outputs.sha }}"
          node portable\app\migrate-sessions-v4.mjs --help
          if ($LASTEXITCODE -ne 0) { throw "migrate-sessions-v4.mjs 装载失败（external 依赖未解析）" }

      # 复制 node 24 运行时（只取自包含的 node.exe；npm/corepack 等开发工具不需要）
      - name: Copy node runtime
        shell: pwsh
        run: |
          $nodeExe = (Get-Command node).Source
          New-Item -ItemType Directory -Force portable\node | Out-Null
          Copy-Item $nodeExe portable\node\node.exe -Force

      # 编译启动器 + 更新器（.NET Framework 4.8 自带 csc）
      - name: Compile launcher and updater
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:portable\dsh.exe `
            /r:System.IO.Compression.FileSystem.dll `
            _build_repo\portable\dsh-launcher.cs
          & $csc /nologo /target:exe /out:portable\update.exe `
            /r:System.IO.Compression.FileSystem.dll `
            /r:System.IO.Compression.dll `
            _build_repo\portable\dsh-updater.cs
          if (-not (Test-Path portable\dsh.exe)) { throw "dsh.exe 编译失败" }
          if (-not (Test-Path portable\update.exe)) { throw "update.exe 编译失败" }

      - name: Write VERSION
        shell: pwsh
        run: |
          Set-Content -Path portable\VERSION -Value "${{ needs.check.outputs.sha }}" -NoNewline

      # 冒烟测试：用便携 node boot 完整插件树（--help 太弱，只打印帮助不加载插件）
      - name: Smoke test
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path (Get-Location) "portable\data"
          $env:PATH = (Join-Path (Get-Location) "portable\node") + ";" + $env:PATH
          # 真正 boot（web 模式）：import 全部插件，比 --dump-default-config 更严格，
          # 能捕获 deploy 漏掉的 registry 依赖（如 cordis-plugin-hmr 的 @babel/code-frame）。
          $outLog = "_smoke.log"
          $errLog = "_smoke.err.log"
          $p = Start-Process -FilePath "portable\node\node.exe" -ArgumentList "portable\app\lib\bin.js","web" -NoNewWindow -RedirectStandardOutput $outLog -RedirectStandardError $errLog -PassThru
          $ok = $false
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and -not $p.HasExited) {
            Start-Sleep -Seconds 1
            try {
              $c = New-Object System.Net.Sockets.TcpClient
              $ar = $c.BeginConnect("127.0.0.1", 3080, $null, $null)
              if ($ar.AsyncWaitHandle.WaitOne(800)) { $c.EndConnect($ar); $c.Close(); $ok = $true; break }
              $c.Close()
            } catch {}
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          if (-not $ok) {
            $merged = @()
            if (Test-Path $outLog) { $merged += Get-Content $outLog }
            if (Test-Path $errLog) { $merged += Get-Content $errLog }
            $merged | Out-File -FilePath $outLog -Encoding utf8
            throw "dsh 冒烟测试失败（未能成功 boot，疑似缺依赖）"
          }
          Write-Host "dsh 成功 boot（3080 监听）"

      # 失败时把 smoke 日志作为 artifact 上传（run 内拉不到日志，只能用 artifact 传递）
      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-error
          path: _smoke.log
          retention-days: 3

      # 校验「随包的应用撑得住它对外宣称的 bundle」。插件面板的分区靠两个硬编码名单
      # （客户端 BUILTIN_PROFILE_BUNDLES / 宿主 OPTIONAL_BUNDLES），而 profile 选中的 bundle
      # 未必是依赖 —— 只靠 app/node_modules 兜着；面板的开关（setBundleEnabled）又只改
      # dsh.profile.bundles、不会安装它。兜不住就是启动时行加载失败，而且只有用户机器上看得见。
      # 名单从**已部署的包**里解析，不写死；解析不出来就退出码 2，逼人来看。
      # 放在 smoke test 之后：默认 profile 是 boot 时生成的，正好拿它当被测 profile。
      - name: Check that the shipped app backs every advertised bundle
        shell: pwsh
        run: |
          $cbArgs = @('_build_repo\portable\check-bundles.mjs', 'portable\app\node_modules')
          if (Test-Path 'portable\data\profiles\web\package.json') {
            $cbArgs += @('--profile', 'portable\data\profiles\web')
          } else {
            Write-Host "默认 profile 不存在，只校验随包名单"
          }
          node @cbArgs
          if ($LASTEXITCODE -ne 0) { throw "check-bundles 失败：随包撑不住某个 bundle（见上面的清单）" }

      # 默认 profile 是 harness boot 时生成的（无 version），而 package-inventory 插件要求
      # 每个活跃条目所属包的 package.json 带非空 name+version；本地相对路径插件会解析到
      # profile 自己，缺 version 即抛错。这里给打包的默认 profile 注入 version，防新装复发。
      - name: Ensure default profile declares version
        shell: pwsh
        run: |
          $pj = "portable/data/profiles/web/package.json"
          if (-not (Test-Path $pj)) { Write-Host "默认 profile 不存在，跳过"; exit 0 }
          node -e "const fs=require('fs');const p='portable/data/profiles/web/package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));if(!j.version){j.version='0.1.0';fs.writeFileSync(p,JSON.stringify(j,null,2))}else{console.log('already has version '+j.version)}"

      # smoke 产物不能进发行包；_smoke*.log 在 portable/ 之外，无需额外排除
      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path portable\* -DestinationPath "dsh-portable-win64-${{ needs.check.outputs.short_sha }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: dsh-portable-win64
          path: dsh-portable-win64-*.zip
          retention-days: 7

  # -------- 合并发布 --------
  release:
    needs: [check, npm, portable]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Remove old release
        env:
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "已删除旧 Release"
          else
            echo "无旧 Release 需要删除（首次构建）"
          fi

      - name: Create Release
        env:
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
          CHANNEL: ${{ needs.check.outputs.channel }}
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
          GLUE_SHA: ${{ github.sha }}
        run: |
          # dev 是 pre-release（不污染稳定 latest）；main 是正式版。
          prerelease=""
          if [ "$CHANNEL" = "dev" ]; then prerelease="--prerelease"; fi
          if [ "$CHANNEL" = "main" ]; then
            TITLE="DSH master"
            NOTES="DSH 稳定版（dsh-master-latest）：由 main 分支发出，上游提交钉在 portable/upstream.pin（可复现）。历史会话与新版功能均正常，推荐使用。想尝鲜切到 dev 通道（dsh-dev-latest，每日跟随上游）。"
          else
            TITLE="DSH dev"
            NOTES="DSH dev 通道（dsh-dev-latest，pre-release）：每日自动构建上游最新代码 + 本地兼容性修复。首次以本版本启动时会自动把本地 v2/v3 会话迁移到 v4（一次性、可回滚）。稳定版请用 dsh-master-latest。"
          fi
          # 机器可读的尾部：check 的跳过判定读的就是这里的 `upstream:` 行，别再改格式。
          NOTES="$(printf '%s\n\nupstream: %s\nchannel: %s\nbuilt-from: %s' "$NOTES" "$UPSTREAM_SHA" "$CHANNEL" "$GLUE_SHA")"
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE ($(date +%Y%m%d))" \
            --notes "$NOTES" \
            $prerelease \
            artifacts/*/*.zip

      # dev 通道：发布成功后才推进 pin，让 pin 永远等于「dev 通道当前产物对应的上游提交」。
      # 它既是 git log dev 上「跟到哪儿了」的记录，也是下一次 schedule 的跳过判据。
      # （用 GITHUB_TOKEN 推送不会再触发 workflow，不会自我循环。）
      - name: Advance the upstream pin (dev only)
        if: needs.check.outputs.channel == 'dev'
        run: |
          if [ "$(cat portable/upstream.pin)" = "${{ needs.check.outputs.sha }}" ]; then
            echo "pin 已指向本次构建的上游提交，无需提交"
            exit 0
          fi
          echo "${{ needs.check.outputs.sha }}" > portable/upstream.pin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portable/upstream.pin
          git commit -m "chore(dev): track upstream ${{ needs.check.outputs.short_sha }}"
          git push

      # -------- 通知（成功） --------
      - name: Send notification (success)
        if: success()
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          sha="${{ needs.check.outputs.short_sha }}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"
          jq -n --arg sha "$sha" --arg url "$url" \
            '{title:"DSH 构建成功",desp:("✅ DSH 构建完成\n\n提交: "+$sha+"\n\n下载: "+$url)}' \
            > /tmp/body.json
          curl -sf -X POST -H "Content-Type: application/json" --data-binary @/tmp/body.json \
            "https://$SC3_UID.push.ft07.com/send/$SC3_SENDKEY.send" || true

  # -------- 失败通知（独立 job：任一 job 失败都触发） --------
  # 关键：不能放在 release job 里——release 的 needs 失败时会被整体跳过，导致
  # if: failure() 永不触发。独立 job + job 级 if: failure() 才能捕获上游失败。
  # release 也放进 needs：只依赖 check/npm/portable 的话，release 自己失败（例如 pin
  # 提交那一步）不会有任何通知 —— 这个坑当场踩到过一次。
  notify-failure:
    needs: [check, npm, portable, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Download smoke error artifact
        uses: actions/download-artifact@v8
        with:
          name: smoke-error
          path: error-artifact
        continue-on-error: true

      - name: Send failure notification
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
        run: |
          # 主来源：失败步骤的真实日志。以前只读 smoke artifact，install/deploy 阶段失败时
          # _smoke.log 根本不存在，通知里的「错误摘要」永远是空的，等于没通知。
          err=""
          err=$(gh run view "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed 2>/dev/null \
                | sed 's/\x1b\[[0-9;]*m//g' \
                | grep -aE "ERR_PNPM|ERR_|Cannot find|Cannot resolve|##\[error\]|throw|failed" \
                | tail -20 || true)
          # smoke 失败时 _smoke.log 里的错误更精确，覆盖上面的摘要
          if [ -s error-artifact/_smoke.log ]; then
            smoke=$(grep -iE "error|cannot find|cannot resolve|not found|throw|ERR_" error-artifact/_smoke.log | head -20 || true)
            if [ -n "$smoke" ]; then err="$smoke"; fi
          fi
          jq -n \
            --arg sha "${{ needs.check.outputs.short_sha }}" \
            --arg err "$err" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{title:("DSH 构建失败 - "+$sha),desp:("❌ DSH 构建失败\n\n提交: "+$sha+"\n\n日志: "+$url+"\n\n错误摘要:\n```\n"+$err+"\n```")}' \
            > /tmp/body.json
          curl -sf -X POST -H "Content-Type: application/json" --data-binary @/tmp/body.json \
            "https://$SC3_UID.push.ft07.com/send/$SC3_SENDKEY.send" || true
