name: Build DSH

# 分支 = 通道：dev（默认分支）跟随上游 master 头 → dsh-dev-latest；main 的 push → dsh-master-latest，
# 目标上游取 portable/upstream.pin（只在晋升时推进，所以稳定版可复现）。
# GitHub 的 schedule 只在默认分支触发，因此每日构建天然只走 dev 通道。
# 跳过判定：自动触发要求「目标上游提交 + 胶水指纹」都相同；手动 dispatch 一律构建。
# 通道语义、晋升路径、产物与本地补丁详见 README.md。
# 这里只做编排：每一步的逻辑在 ci/（流水线脚本）与 portable/（构建 / 补丁脚本）里，可在本地单独跑。
on:
  schedule:
    # 只会在默认分支（dev）上触发 —— 这也是 main 不会自动发稳定版的原因。
    - cron: "0 6 * * *"
  push:
    branches: [main]
    # 只有会改变产物的路径才重建稳定版；纯文档改动不惊动它。
    paths:
      - "portable/**"
      - "tests/**"
      - "ci/**"
      - ".github/workflows/**"
  # 手动触发一律构建（不跳过）。channel 默认 auto = 跟随分支；
  # 显式选 main 只刷 dsh-master-latest（稳定 tag），选 dev 只刷 dsh-dev-latest（预发布 tag）——
  # 这样在 main 分支上手动验证流水线时不会误刷稳定通道。
  workflow_dispatch:
    inputs:
      channel:
        description: "构建通道：auto=跟随分支，main=只刷稳定 tag，dev=只刷预发布 tag"
        type: choice
        options: [auto, dev, main]
        default: auto

# 同通道构建排队（不取消正在跑的）：release 收尾是 delete + create，非原子，
# 同通道并发会互相删掉 release/tag，可能发出资产不全或 body 与资产不同源的产物。
# 不同通道 group 不同，仍可并行。
concurrency:
  group: build-${{ inputs.channel == 'main' && 'main' || inputs.channel == 'dev' && 'dev' || github.ref_name == 'main' && 'main' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # pnpm 版本单一事实来源：11.27.1。12.x 全系在工作区里跑 `pnpm run/exec` 必失败（内部那次依赖
  # 校验安装带上了已被自己移除的 verify-deps-before-run-install，外部 --config 覆盖救不了）；
  # 11.7.0 又有 hoisted 缺陷 pnpm#12880（整目录替换会静默删掉并发兄弟的 _tmp_*）。
  # 两个构建 job 因此都在 checkout 后把 packageManager 对齐到本版本（否则 pnpm 自动回退 11.7.0），
  # 且每次 pnpm 调用带 --pm-on-fail=ignore（防它把 packageManagerDependencies 写进锁文件）。
  PNPM_VERSION: "11.27.1"

jobs:
  # -------- 解析目标上游提交 + 跳过判定 --------
  check:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      glue: ${{ steps.resolve.outputs.glue }}
    steps:
      # dev 通道要读上游 master 头，所以工作目录检出的是上游仓库
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
          sparse-checkout: ci
      - name: Resolve target upstream commit
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          BUILD_SHA: ${{ github.sha }}
        run: bash _build_repo/ci/resolve-target.sh

  # -------- npm tarball 集合（ubuntu） --------
  npm:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
          sparse-checkout: ci
      # 把上游钉的 packageManager 对齐到我们要跑的 pnpm（理由见顶层 env 注释）
      - name: Align packageManager pin with the pnpm we run
        run: node _build_repo/ci/align-package-manager.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Show toolchain versions
        run: pnpm --version && node --version
      - name: Install dependencies
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile
      - name: Build
        run: pnpm --pm-on-fail=ignore run build:official
      - name: Pack release tarballs
        run: pnpm --pm-on-fail=ignore run release:pack --family dsh --out dist/npm
      - name: Archive npm tarballs
        run: zip -r "dsh-npm-tarballs-${{ needs.check.outputs.short_sha }}.zip" dist/npm
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-npm-tarballs
          path: dsh-npm-tarballs-*.zip
          retention-days: 7

  # -------- Windows 绿色便携包 --------
  portable:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      # 二次 checkout 自己的仓库。必须显式 ref：不带 ref 时取的是**默认分支**（dev），
      # 在 main 上跑 CI 时 _build_repo 里会是 dev 的胶水 —— 分支验证会失真。
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
      - name: Align packageManager pin with the pnpm we run
        run: node _build_repo/ci/align-package-manager.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Show toolchain versions
        run: pnpm --version; node --version
      - name: Install dependencies (hoisted)
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile --config.node-linker=hoisted --config.allowUnusedPatches=true
      - name: Build
        run: pnpm --pm-on-fail=ignore run build:official

      # 全部补丁单测（独立 fixtures，不依赖上游构建产物）
      - name: Run patch tests
        run: node --test "_build_repo/tests/*.test.mjs"

      # 哨兵：列出 workspace 里**精确版本**钉法的 peer（note 级，永远不拦构建）。
      # 钉版变多 = 上游又收紧了；全没了 = 可以回头重新评估 profile 安装这条路。
      - name: Check peer pins (note)
        run: |
          node _build_repo/portable/check-peer-pins.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "check-peer-pins --self-test 失败（扫描逻辑坏了）" }
          node _build_repo/portable/check-peer-pins.mjs .
          if ($LASTEXITCODE -ne 0) { throw "check-peer-pins 失败：一个 @deepseek-ai 包都没扫到，目录布局变了？" }

      # deploy → 迁移器 → 补 peer / registry 依赖 → 瘦身（顺序与理由见脚本）
      - name: Assemble portable runtime
        run: _build_repo/ci/portable/assemble-runtime.ps1
      - name: Assert computer-use and browser-use shipped and declared
        run: _build_repo/ci/portable/assert-shipped.ps1
      - name: Apply local harness fixes and load-check the migrator
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: _build_repo/ci/portable/apply-fixes.ps1
      - name: Compile launcher and updater
        run: _build_repo/ci/compile-exes.ps1 -OutDir portable -Launcher
      - name: Copy node runtime, write VERSION and GLUE
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
          GLUE: ${{ needs.check.outputs.glue }}
        run: _build_repo/ci/portable/stamp.ps1
      - name: Smoke test (real boot)
        run: _build_repo/ci/portable/smoke-boot.ps1
      # 失败时把 smoke 日志作为 artifact 上传（notify-failure 读它）
      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-error
          path: _smoke.log
          retention-days: 3
      - name: Check bundles and package portable zip
        env:
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: _build_repo/ci/portable/finalize.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-portable-win64
          path: dsh-portable-win64-*.zip
          retention-days: 7

  # -------- 桌面端绿色包（windows，Electron 外壳 + 内置 dsh 运行时） --------
  # 与 portable 同一上游提交、同一 Release。用上游**自己的**依赖布局（isolated linker）与 Electron 运行时；
  # 兼容性补丁由 portable/patch-desktop-*.mjs 在构建期打进去（顺序见 build-desktop.mjs 头注释）。
  desktop:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
      - name: Align packageManager pin with the pnpm we run
        run: node _build_repo/ci/align-package-manager.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Show toolchain versions
        run: pnpm --version; node --version
      # 桌面端不部署，所以**不加** node-linker=hoisted：prepare-*/electron-builder 都按上游 workspace 布局写的。
      - name: Install dependencies (workspace default linker)
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile --config.allowUnusedPatches=true

      # DSH_DESKTOP_SOURCE 让 ACL 控制台补丁的测试连上游源码那半一起跑（否则静默跳过）
      - name: Run patch tests
        env:
          DSH_DESKTOP_SOURCE: ${{ github.workspace }}
        run: node --test "_build_repo/tests/*.test.mjs"

      # 清单驱动的 update.exe（与便携版同一份源码：靠包内 update.json 认自己的资产前缀与镜像范围）
      - name: Compile updater
        run: _build_repo/ci/compile-exes.ps1 -OutDir _build_repo\portable

      - name: Build desktop green package
        env:
          DSH_DESKTOP_SOURCE: ${{ github.workspace }}
          DSH_DESKTOP_TAG: ${{ needs.check.outputs.sha }}
          DSH_DESKTOP_OUT: ${{ github.workspace }}\desktop-build
          DSH_DESKTOP_ZIP: ${{ github.workspace }}\dsh-desktop-win64-${{ needs.check.outputs.short_sha }}.zip
          DSH_DESKTOP_UPDATE_EXE: ${{ github.workspace }}\_build_repo\portable\update.exe
          # 打包后冒烟（smoke-packaged-runtime.ts）在 CI 上会失败：packaged 布局里的 LibreOffice 原生转换
          # 返回空引用（loadComponentFromURL）。准备阶段的运行时冒烟（prepare:dsh）在 CI 上是**通过**的，
          # 产物另有 verify-desktop.mjs 静态验收，故这里不开启。
          DSH_DESKTOP_RUN_PACKAGED_SMOKE: "0"
        run: node _build_repo/portable/build-desktop.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-win64
          path: dsh-desktop-win64-*.zip
          retention-days: 7

  # -------- 合并发布 --------
  release:
    needs: [check, npm, portable, desktop]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      CHANNEL: ${{ needs.check.outputs.channel }}
      UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
      SHORT_SHA: ${{ needs.check.outputs.short_sha }}
      GLUE: ${{ needs.check.outputs.glue }}
      GLUE_SHA: ${{ github.sha }}
    steps:
      # 检出分支（而不是 sha）：dev 通道要在这里提交并推送 pin
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        run: bash ci/release/publish.sh
      - name: Advance the upstream pin (dev only)
        if: needs.check.outputs.channel == 'dev'
        run: bash ci/release/advance-pin.sh
      - name: Send notification (success)
        if: success()
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
        run: bash ci/notify.sh success

  # -------- 失败通知（独立 job：任一 job 失败都触发） --------
  # 不能放在 release job 里：release 的 needs 失败时会被整体跳过，if: failure() 永不触发。
  # release 也要在 needs 里，否则 release 自己失败（例如 pin 提交那一步）不会有通知。
  notify-failure:
    needs: [check, npm, portable, desktop, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          sparse-checkout: ci
      - name: Download smoke error artifact
        uses: actions/download-artifact@v8
        with:
          name: smoke-error
          path: error-artifact
        continue-on-error: true
      - name: Send failure notification
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: bash ci/notify.sh failure
