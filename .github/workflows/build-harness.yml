name: Build DSH

# 分支 = 通道：dev（默认分支）跟随上游 master 头 → dsh-dev-latest；main 的 push → dsh-master-latest，
# 目标上游取 portable/upstream.pin（只在晋升时推进，所以稳定版可复现）。
# GitHub 的 schedule 只在默认分支触发，因此每日构建天然只走 dev 通道。
# 跳过判定：自动触发要求「目标上游提交 + 胶水指纹」都相同；手动 dispatch 一律构建。
# 另有方向护栏：已发布的上游提交必须本次目标的祖先，否则不构建（上游并行维护 rc / alpha 两条线，
# 稳定线同步回 master 期间版本号会倒退，那种产物会覆盖用户手上更新的版本）。
# 通道语义、晋升路径、产物与本地补丁详见 README.md。
# 这里只做编排：每一步的逻辑在 ci/（流水线脚本）与 portable/（构建 / 补丁脚本）里，可在本地单独跑。
on:
  schedule:
    # 只会在默认分支（dev）上触发 —— 这也是 main 不会自动发稳定版的原因。
    - cron: "0 6 * * *"
  push:
    branches: [main]
    # 只有会改变产物的路径才重建稳定版；纯文档改动不惊动它。
    paths:
      - "portable/**"
      - "tests/**"
      - "ci/**"
      - ".github/workflows/**"
  # 手动触发一律构建（不跳过）。channel 默认 auto = 跟随分支；
  # 显式选 main 只刷 dsh-master-latest（稳定 tag），选 dev 只刷 dsh-dev-latest（预发布 tag）——
  # 这样在 main 分支上手动验证流水线时不会误刷稳定通道。
  workflow_dispatch:
    inputs:
      channel:
        description: "构建通道：auto=跟随分支，main=只刷稳定 tag，dev=只刷预发布 tag"
        type: choice
        options: [auto, dev, main]
        default: auto

# 同通道构建排队（不取消正在跑的）：release 收尾是 delete + create，非原子，
# 同通道并发会互相删掉 release/tag，可能发出资产不全或 body 与资产不同源的产物。
# 不同通道 group 不同，仍可并行。
concurrency:
  group: build-${{ inputs.channel == 'main' && 'main' || inputs.channel == 'dev' && 'dev' || github.ref_name == 'main' && 'main' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # pnpm 版本不再手写：`ci/align-package-manager.mjs` 从上游根 package.json 的
  # devDependencies.pnpm 读出来（桌面版 primary-runtime 里的 pnpm 正是 prepare.ts 从那份拷进去的，
  # 所以构建用的 pnpm 恒等于用户运行时拿到的 pnpm），校验禁区后经 $GITHUB_OUTPUT 交给
  # 下面的 pnpm/action-setup。禁区：<11.7.1 有 hoisted 缺陷 pnpm#12880（整目录替换会静默删掉
  # 并发兄弟的 _tmp_*）；12.x 全系在工作区里跑 `pnpm run/exec` 必失败（内部那次依赖校验安装带上了
  # 已被自己移除的 verify-deps-before-run-install，外部 --config 覆盖救不了）。
  # 留空 = 自动跟随上游；只在紧急钉版时才填（填了会与随包 pnpm 不同版本，脚本会警告）。
  # 三个 job 都在 checkout 后跑它对齐 packageManager（否则 pnpm 自动回退上游钉的那个版本），
  # 且每次 pnpm 调用带 --pm-on-fail=ignore（防它把 packageManagerDependencies 写进锁文件）。
  PNPM_VERSION: ""

jobs:
  # -------- 解析目标上游提交 + 跳过判定 --------
  check:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.resolve.outputs.channel }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      skip: ${{ steps.resolve.outputs.skip }}
      regressed: ${{ steps.resolve.outputs.regressed }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      glue: ${{ steps.resolve.outputs.glue }}
    steps:
      # dev 通道要读上游 master 头，所以工作目录检出的是上游仓库
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
          sparse-checkout: ci
      - name: Resolve target upstream commit
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          BUILD_SHA: ${{ github.sha }}
        run: bash _build_repo/ci/resolve-target.sh

  # -------- Windows Computer Use helper（.NET 10 self-contained） --------
  # 单一来源：三份产物都从这里取同一个 payload。上游 cua-windows 在安装态只 access() 已有文件、
  # 从不编译（packages/experimental/cua-windows/src/native-build.ts 的 prepareNativeExecutable），
  # 而用户机器没有 .NET SDK —— 所以 helper 必须由 CI 产好、随包发行。
  # 上传**目录**而不是 zip：下游 job 的 stage 直接读目录树，跨平台（ubuntu 的 npm job）不必解压。
  cua-helper:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
      # 本仓脚本声明 engines node>=24（cua-helper.mjs 用 Node 24 的 API），runner 自带的 node
      # 版本会随镜像漂移，所以这里显式钉 24，与 npm/portable/desktop 三个 job 保持一致。
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # locked restore → Protocol.Tests → win-x64 self-contained publish → cua-helper.json → 自校验
      - name: Build the win-x64 helper and verify the payload
        run: _build_repo/ci/portable/build-cua-helper.ps1 -Root . -Commit ${{ needs.check.outputs.sha }}
      - uses: actions/upload-artifact@v7
        with:
          name: cua-helper-win-x64
          path: dist/cua-helper-win-x64/
          if-no-files-found: error
          retention-days: 7

  # -------- npm tarball 集合（ubuntu） --------
  npm:
    needs: [check, cua-helper]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
          # portable 里有 helper 契约脚本与源码补丁；缺了它们 npm tarball 会少 helper、
          # 少默认启用，而 tarball 本身仍然「打得出来」。
          sparse-checkout: |
            ci
            portable
      # 把上游钉的 packageManager 对齐到我们要跑的 pnpm（理由见顶层 env 注释）
      - name: Align packageManager pin with the pnpm we run
        id: align-pnpm
        run: node _build_repo/ci/align-package-manager.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.align-pnpm.outputs.pnpm_version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Show toolchain versions
        run: pnpm --version && node --version
      # helper 在 npm tarball 里也必须完整：cua-windows 的 files 含 native/bin，而安装态 provider
      # 只 access() 这个目录（不编译）。stage 校验失败就直接失败，不产出「看起来打得出来」的半成品。
      - uses: actions/download-artifact@v8
        with:
          name: cua-helper-win-x64
          path: cua-helper
      # 唯一要改上游源码的步骤：默认启用改 official-bundles 的 TypeScript 源。
      # 必须早于 build:official（它编译 src/bundles.ts）；锚点缺失 → 脚本 exit 1 → 本 job 失败。
      # 上游 CUA 源码不动，所以这里没有 CUA 源码补丁。
      - name: Apply CUA default bundle
        run: node _build_repo/portable/patch-cua-defaults.mjs .
      # 取原生源码摘要：helper 是在**这棵（原样的）** native 树上编译的，digest 相同才算同一份。
      # 摘要工具对被污染的上游树会拒绝出值，所以这一步同时是「源码没被动过」的守门。
      - name: Capture the native source digest
        run: |
          node _build_repo/portable/patch-cua-ui-locate-bridge.mjs --digest --root . > native-digest.log 2>&1
          grep '"kind":"cua-helper-native-source"' native-digest.log > native-source.json
          node -e "const s=require('./native-source.json');if(s.kind!=='cua-helper-native-source')throw new Error('native 摘要工具没有输出原生源码摘要');console.log('native digest', s.digest, s.fileCount, 'files')"
      - name: Stage the Windows helper into the upstream tree
        run: node _build_repo/portable/cua-helper.mjs stage --from cua-helper --root . --commit ${{ needs.check.outputs.sha }} --native-source-file native-source.json
      - name: Install dependencies
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile
      - name: Build
        run: pnpm --pm-on-fail=ignore run build:official
      - name: Pack release tarballs
        run: pnpm --pm-on-fail=ignore run release:pack --family dsh --out dist/npm
      # 不只看 tarball 里有没有文件名：解包后按 win-x64 安装态布局校验整树 SHA + cua-helper.json。
      - name: Verify the helper inside the published tarball
        run: |
          tarball=$(ls dist/npm/*cua-windows*.tgz)
          node _build_repo/portable/cua-helper.mjs verify-tarball --tarball "$tarball" --commit ${{ needs.check.outputs.sha }} --native-source-file native-source.json
      - name: Archive npm tarballs
        run: zip -r "dsh-npm-tarballs-${{ needs.check.outputs.short_sha }}.zip" dist/npm
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-npm-tarballs
          path: dsh-npm-tarballs-*.zip
          retention-days: 7

  # -------- Windows 绿色便携包 --------
  portable:
    needs: [check, cua-helper]
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      # 二次 checkout 自己的仓库。必须显式 ref：不带 ref 时取的是**默认分支**（dev），
      # 在 main 上跑 CI 时 _build_repo 里会是 dev 的胶水 —— 分支验证会失真。
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
      - name: Align packageManager pin with the pnpm we run
        id: align-pnpm
        run: node _build_repo/ci/align-package-manager.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.align-pnpm.outputs.pnpm_version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Show toolchain versions
        run: pnpm --version; node --version
      # 全部补丁单测（独立 fixtures，不依赖上游构建产物，因此放在 install 之前）。
      # 必须在构建（install / build:official）之前跑：摘要与审计用例需要一份 pin 原始形状的上游树，
      # 通过 UI_LOCATE_UPSTREAM 指过去；缺树时那组用例会跳过（= 假绿），所以这一步必须先于构建。
      - name: Run patch tests
        env:
          UI_LOCATE_UPSTREAM: ${{ github.workspace }}
        run: node --test "_build_repo/tests/*.test.mjs"
      # deploy 会把 packages/experimental/cua-windows 整个复制进 portable/app，但 native/bin 是
      # 构建产物、不在仓库里 —— 所以必须在 install/deploy 之前就把它摆好，否则 deploy 出来的
      # 包缺 helper，而安装态 provider 不会替你编译（它只 access() 已有文件）。
      - uses: actions/download-artifact@v8
        with:
          name: cua-helper-win-x64
          path: cua-helper
      # 唯一要改上游源码的步骤：默认启用改 official-bundles 的 TS（build:official 编译它）。
      # 上游 CUA 源码不动。
      - name: Apply CUA default bundle
        run: node _build_repo/portable/patch-cua-defaults.mjs .
      # 取原生源码摘要：只认这棵原样 native 树上编译的 helper，digest 不符即拒绝。
      - name: Capture the native source digest
        run: |
          node _build_repo/portable/patch-cua-ui-locate-bridge.mjs --digest --root . > native-digest.log 2>&1
          $hit = @(Get-Content native-digest.log | Where-Object { $_ -match '"kind"\s*:\s*"cua-helper-native-source"' })
          if ($hit.Count -ne 1) { throw "native 摘要工具应输出且只输出一行原生源码摘要，实际 $($hit.Count) 行" }
          Set-Content -Path native-source.json -Value $hit[0] -Encoding utf8NoBOM
          node -e "const s=require('./native-source.json');if(s.kind!=='cua-helper-native-source')throw new Error('native 摘要工具没有输出原生源码摘要');console.log('native digest', s.digest, s.fileCount, 'files')"
      - name: Stage the Windows helper into the upstream tree
        run: node _build_repo/portable/cua-helper.mjs stage --from cua-helper --root . --commit ${{ needs.check.outputs.sha }} --native-source-file native-source.json
      - name: Install dependencies (hoisted)
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile --config.node-linker=hoisted --config.allowUnusedPatches=true
      - name: Build
        run: pnpm --pm-on-fail=ignore run build:official

      # 哨兵：列出 workspace 里**精确版本**钉法的 peer（note 级，永远不拦构建）。
      # 钉版变多 = 上游又收紧了；全没了 = 可以回头重新评估 profile 安装这条路。
      - name: Check peer pins (note)
        run: |
          node _build_repo/portable/check-peer-pins.mjs --self-test
          if ($LASTEXITCODE -ne 0) { throw "check-peer-pins --self-test 失败（扫描逻辑坏了）" }
          node _build_repo/portable/check-peer-pins.mjs .
          if ($LASTEXITCODE -ne 0) { throw "check-peer-pins 失败：一个 @deepseek-ai 包都没扫到，目录布局变了？" }

      # deploy → 迁移器 → 补 peer / registry 依赖 → 瘦身（顺序与理由见脚本）
      - name: Assemble portable runtime
        run: _build_repo/ci/portable/assemble-runtime.ps1
      - name: Assert computer-use and browser-use shipped and declared
        run: _build_repo/ci/portable/assert-shipped.ps1
      - name: Apply local harness fixes and load-check the migrator
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
        run: _build_repo/ci/portable/apply-fixes.ps1
      - name: Compile launcher and updater
        run: _build_repo/ci/compile-exes.ps1 -OutDir portable -Launcher
      - name: Copy node runtime, write VERSION and GLUE
        env:
          UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
          GLUE: ${{ needs.check.outputs.glue }}
        run: _build_repo/ci/portable/stamp.ps1
      - name: Smoke test (real boot)
        run: _build_repo/ci/portable/smoke-boot.ps1
      # 失败时把 smoke 日志作为 artifact 上传（notify-failure 读它）
      - name: Upload smoke log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-error
          path: _smoke.log
          retention-days: 3
      - name: Check bundles and package portable zip
        env:
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: _build_repo/ci/portable/finalize.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-portable-win64
          path: dsh-portable-win64-*.zip
          retention-days: 7

  # -------- 桌面端绿色包（windows，Electron 外壳 + 内置 dsh 运行时） --------
  # 与 portable 同一上游提交、同一 Release。用上游**自己的**依赖布局（isolated linker）与 Electron 运行时；
  # 兼容性补丁由 portable/patch-desktop-*.mjs 在构建期打进去（顺序见 build-desktop.mjs 头注释）。
  desktop:
    needs: [check, cua-helper]
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ needs.check.outputs.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          path: _build_repo
      - name: Align packageManager pin with the pnpm we run
        id: align-pnpm
        run: node _build_repo/ci/align-package-manager.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.align-pnpm.outputs.pnpm_version }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - name: Show toolchain versions
        run: pnpm --version; node --version
      # 与 portable 同理：测试在 install 之前跑（夹具自带依赖，零 npm 依赖）。
      # DSH_DESKTOP_SOURCE 让 ACL 控制台补丁的测试连上游源码那半一起跑（否则静默跳过）；
      # UI_LOCATE_UPSTREAM 让审计用例拿到 pin 原始形状的上游树（否则跳过 = 假绿）。
      - name: Run patch tests
        env:
          DSH_DESKTOP_SOURCE: ${{ github.workspace }}
          UI_LOCATE_UPSTREAM: ${{ github.workspace }}
        run: node --test "_build_repo/tests/*.test.mjs"

      # 桌面端在 install 前把 helper 摆进上游树：build-desktop.mjs 会在打包前用 cua-helper.mjs
      # 校验整树摘要（缺件/架构/提交不符都直接失败），asarUnpack 的 native/bin/** 才有东西可解。
      - uses: actions/download-artifact@v8
        with:
          name: cua-helper-win-x64
          path: cua-helper
      # 桌面端的默认启用补丁同样必须早于 install/build:official；build-desktop.mjs 里还会再跑一遍（幂等），
      # 并在其后自取 digest 校验 helper。上游 CUA 源码不动。
      - name: Apply CUA default bundle
        run: node _build_repo/portable/patch-cua-defaults.mjs .
      - name: Capture the native source digest
        run: |
          node _build_repo/portable/patch-cua-ui-locate-bridge.mjs --digest --root . > native-digest.log 2>&1
          $hit = @(Get-Content native-digest.log | Where-Object { $_ -match '"kind"\s*:\s*"cua-helper-native-source"' })
          if ($hit.Count -ne 1) { throw "native 摘要工具应输出且只输出一行原生源码摘要，实际 $($hit.Count) 行" }
          Set-Content -Path native-source.json -Value $hit[0] -Encoding utf8NoBOM
          node -e "const s=require('./native-source.json');if(s.kind!=='cua-helper-native-source')throw new Error('native 摘要工具没有输出原生源码摘要');console.log('native digest', s.digest, s.fileCount, 'files')"
      - name: Stage the Windows helper into the upstream tree
        run: node _build_repo/portable/cua-helper.mjs stage --from cua-helper --root . --commit ${{ needs.check.outputs.sha }} --native-source-file native-source.json
      # 桌面端不部署，所以**不加** node-linker=hoisted：prepare-*/electron-builder 都按上游 workspace 布局写的。
      - name: Install dependencies (workspace default linker)
        run: pnpm --pm-on-fail=ignore install --frozen-lockfile --config.allowUnusedPatches=true

      # 清单驱动的 update.exe（与便携版同一份源码：靠包内 update.json 认自己的资产前缀与镜像范围）
      - name: Compile updater
        run: _build_repo/ci/compile-exes.ps1 -OutDir _build_repo\portable

      - name: Build desktop green package
        env:
          DSH_DESKTOP_SOURCE: ${{ github.workspace }}
          DSH_DESKTOP_TAG: ${{ needs.check.outputs.sha }}
          DSH_DESKTOP_OUT: ${{ github.workspace }}\desktop-build
          DSH_DESKTOP_ZIP: ${{ github.workspace }}\dsh-desktop-win64-${{ needs.check.outputs.short_sha }}.zip
          DSH_DESKTOP_UPDATE_EXE: ${{ github.workspace }}\_build_repo\portable\update.exe
          # 打包后冒烟（smoke-packaged-runtime.ts）在 CI 上会失败：packaged 布局里的 LibreOffice 原生转换
          # 返回空引用（loadComponentFromURL）。准备阶段的运行时冒烟（prepare:dsh）在 CI 上是**通过**的，
          # 产物另有 verify-desktop.mjs 静态验收，故这里不开启。
          DSH_DESKTOP_RUN_PACKAGED_SMOKE: "0"
        run: node _build_repo/portable/build-desktop.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: dsh-desktop-win64
          path: dsh-desktop-win64-*.zip
          retention-days: 7

  # -------- 合并发布 --------
  release:
    needs: [check, npm, portable, desktop]
    # 只在发布分支上发布。on.push 只对 main 生效，但 workflow_dispatch 可以指向任意
    # ref（我们正是用 feat 分支 dispatch 跑真实构建验收）—— 那种运行 skip 通常是 false，
    # 若不按分支收紧，publish.sh 会覆盖 dsh-dev-latest / dsh-master-latest 资产，
    # dev 通道还会 advance-pin.sh 往分支推 pin。feat/topic 分支只构建与验收，不发布。
    if: needs.check.outputs.skip != 'true' && (github.ref_name == 'main' || github.ref_name == 'dev')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
      CHANNEL: ${{ needs.check.outputs.channel }}
      UPSTREAM_SHA: ${{ needs.check.outputs.sha }}
      SHORT_SHA: ${{ needs.check.outputs.short_sha }}
      GLUE: ${{ needs.check.outputs.glue }}
      GLUE_SHA: ${{ github.sha }}
    steps:
      # 检出分支（而不是 sha）：dev 通道要在这里提交并推送 pin
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Publish release
        run: bash ci/release/publish.sh
      - name: Advance the upstream pin (dev only)
        if: needs.check.outputs.channel == 'dev'
        run: bash ci/release/advance-pin.sh
      - name: Send notification (success)
        if: success()
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
        run: bash ci/notify.sh success

  # -------- 回退通知（独立 job：release 在 skip 时根本不跑，挂不上） --------
  # 方向护栏（ci/resolve-target.sh）判定上游在回退时把 skip 置真 —— 流水线整体是绿的、
  # 只是产物没更新。静默跳过会让人误以为"今天上游没动"，所以单独推一条。
  notify-regressed:
    needs: [check]
    if: needs.check.outputs.regressed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          sparse-checkout: ci
      - name: Send regression notification
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
          RELEASE_TAG: ${{ needs.check.outputs.release_tag }}
        run: bash ci/notify.sh regressed

  # -------- 失败通知（独立 job：任一 job 失败都触发） --------
  # 不能放在 release job 里：release 的 needs 失败时会被整体跳过，if: failure() 永不触发。
  # release 也要在 needs 里，否则 release 自己失败（例如 pin 提交那一步）不会有通知。
  notify-failure:
    needs: [check, npm, portable, desktop, release]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: citydirector/DSH-build
          ref: ${{ github.sha }}
          sparse-checkout: ci
      - name: Download smoke error artifact
        uses: actions/download-artifact@v8
        with:
          name: smoke-error
          path: error-artifact
        continue-on-error: true
      - name: Send failure notification
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
          SHORT_SHA: ${{ needs.check.outputs.short_sha }}
        run: bash ci/notify.sh failure