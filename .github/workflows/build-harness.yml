name: Build DSH

# 定时拉取上游 deepseek-harness master，有新 commit 才构建。
# 两个产物：
#   1. npm tarball 集合（ubuntu，官方 release:pack 链）
#   2. Windows 绿色便携包（windows，node 便携运行时 + hoisted 依赖 + dsh.exe 启动器 + update.exe 更新器）
# 合并发布到同一个 Release（tag: dsh-master-latest）。
# 关键：比较上游 SHA 用 checkout 之后的 git rev-parse HEAD，不要用 github.sha。

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force build even if upstream has no new commits"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # -------- 检查上游是否有新提交 --------
  check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      sha: ${{ steps.check.outputs.sha }}
      short_sha: ${{ steps.check.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0

      - name: Check if upstream has new commits
        id: check
        shell: bash
        run: |
          currentSha="$(git rev-parse HEAD)"
          shortSha="${currentSha:0:7}"
          echo "sha=$currentSha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$shortSha" >> "$GITHUB_OUTPUT"
          # 手动触发时勾选 force 可强制构建（无视上游是否有新提交）
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🔨 强制构建 (force=true)"
            exit 0
          fi
          apiUrl="https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/dsh-master-latest"
          if body="$(curl -sf -H "Authorization: Bearer $GH_TOKEN" "$apiUrl" | jq -r .body)"; then
            lastSha="$(printf '%s' "$body" | sed 's/.*@//')"
            if [ "$lastSha" = "$currentSha" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "✅ 上游 master 无新提交 ($currentSha)，跳过构建"
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "📦 上游有更新: $lastSha → $currentSha"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🆕 首次构建或查询出错，将执行构建"
          fi

  # -------- npm tarball 集合（ubuntu） --------
  npm:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Pack release tarballs
        run: pnpm run release:pack --family dsh --out dist/npm

      - name: Archive npm tarballs
        shell: bash
        run: |
          zip -r "dsh-npm-tarballs-${{ needs.check.outputs.short_sha }}.zip" dist/npm

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-npm-tarballs
          path: dsh-npm-tarballs-*.zip
          retention-days: 7

  # -------- Windows 绿色便携包 --------
  portable:
    needs: check
    if: needs.check.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 0

      # 二次 checkout 自己的仓库，取 portable/ 下的启动器与更新器源码
      - uses: actions/checkout@v4
        with:
          repository: citydirector/DSH-build
          path: _build_repo

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies (hoisted)
        shell: pwsh
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Build
        shell: pwsh
        run: pnpm run build

      # deploy 到 portable/app：把 @deepseek-ai/dsh 的包文件(lib/bin.js)放到 app 根，
      # 依赖(含 workspace 包)装进 app/node_modules。不加 --prod（dsh 运行时插件在
      # devDependencies，靠 cordis 动态加载）；不加 auto-install-peers=false。
      - name: Deploy portable runtime
        shell: pwsh
        run: |
          pnpm --filter @deepseek-ai/dsh deploy --legacy `
            --config.node-linker=hoisted `
            --config.link-workspace-packages=true `
            portable/app

      # deploy 会系统性漏掉 workspace 包之间的 peer 依赖（auto-install-peers 对
      # deploy 无效）。patch-peers.mjs 遍历 workspace 全部 @deepseek-ai 包，把缺失的
      # 补齐（复制 lib/ + package.json）。实测补 55 个包，--dump-default-config 全绿。
      - name: Patch missing workspace packages
        shell: pwsh
        run: |
          node _build_repo\portable\patch-peers.mjs . portable\app\node_modules\@deepseek-ai

      # schemastery 依赖 @standard-schema/spec（registry 包，非 workspace），从 install 结果复制
      - name: Patch registry peer (standard-schema)
        shell: pwsh
        run: |
          if (Test-Path "node_modules\@standard-schema\spec") {
            New-Item -ItemType Directory -Force "portable\app\node_modules\@standard-schema" | Out-Null
            Copy-Item "node_modules\@standard-schema\spec" "portable\app\node_modules\@standard-schema\spec" -Recurse -Force
          }

      # 体积优化：删 sourcemap + build 工具（编译/lint/打包器/hooks，运行时绝不 import）。
      # typescript 被 dsh-typert-generator（编译期生成器）依赖，但运行时无 import，可删。
      - name: Strip build tools and sourcemaps
        shell: pwsh
        run: |
          $nm = "portable\app\node_modules"
          Get-ChildItem $nm -Recurse -Filter "*.map" -File | Remove-Item -Force -ErrorAction SilentlyContinue
          $buildTools = @(
            'typescript','tsx','@esbuild','@rolldown','@oxlint','@oxlint-tsgolint',
            'lefthook','lefthook-windows-x64','lightningcss','lightningcss-win32-x64-msvc',
            '@babel','tsdown','vite','rollup','eslint','webpack','terser','prettier','oxc-resolver'
          )
          foreach ($t in $buildTools) {
            $p = Join-Path $nm $t
            if (Test-Path $p) { Remove-Item -Recurse -Force $p -ErrorAction SilentlyContinue }
          }

      # 复制 node 24 运行时（只取自包含的 node.exe；npm/corepack 等开发工具不需要）
      - name: Copy node runtime
        shell: pwsh
        run: |
          $nodeExe = (Get-Command node).Source
          New-Item -ItemType Directory -Force portable\node | Out-Null
          Copy-Item $nodeExe portable\node\node.exe -Force

      # 编译启动器 + 更新器（.NET Framework 4.8 自带 csc）
      - name: Compile launcher and updater
        shell: pwsh
        run: |
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:exe /out:portable\dsh.exe `
            /r:System.IO.Compression.FileSystem.dll `
            _build_repo\portable\dsh-launcher.cs
          & $csc /nologo /target:exe /out:portable\update.exe `
            /r:System.IO.Compression.FileSystem.dll `
            _build_repo\portable\dsh-updater.cs
          if (-not (Test-Path portable\dsh.exe)) { throw "dsh.exe 编译失败" }
          if (-not (Test-Path portable\update.exe)) { throw "update.exe 编译失败" }

      - name: Write VERSION
        shell: pwsh
        run: |
          Set-Content -Path portable\VERSION -Value "${{ needs.check.outputs.sha }}" -NoNewline

      # 冒烟测试：用便携 node boot 完整插件树（--help 太弱，只打印帮助不加载插件）
      - name: Smoke test
        shell: pwsh
        run: |
          $env:DSH_HOME = Join-Path (Get-Location) "portable\data"
          $env:PATH = (Join-Path (Get-Location) "portable\node") + ";" + $env:PATH
          & portable\node\node.exe portable\app\lib\bin.js --dump-default-config --profile web
          if ($LASTEXITCODE -ne 0) { throw "dsh 冒烟测试失败（插件树 boot 失败）" }

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path portable\* -DestinationPath "dsh-portable-win64-${{ needs.check.outputs.short_sha }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-portable-win64
          path: dsh-portable-win64-*.zip
          retention-days: 7

  # -------- 合并发布 --------
  release:
    needs: [check, npm, portable]
    if: needs.check.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: master
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Remove old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "dsh-master-latest" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "dsh-master-latest" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "已删除旧 Release"
          else
            echo "无旧 Release 需要删除（首次构建）"
          fi

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "dsh-master-latest" \
            --repo "$GITHUB_REPOSITORY" \
            --title "DSH master ($(date +%Y%m%d))" \
            --notes "Auto build master@$(git rev-parse HEAD)" \
            artifacts/*/*.zip

      # -------- 通知（成功） --------
      - name: Send notification (success)
        if: success()
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
        run: |
          sha="${{ needs.check.outputs.short_sha }}"
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/dsh-master-latest"
          body="{\"title\":\"DSH 构建成功\",\"desp\":\"✅ DSH 构建完成 - 提交: $sha - 下载: dsh-master-latest\"}"
          curl -sf -X POST -H "Content-Type: application/json" -d "$body" \
            "https://$SC3_UID.push.ft07.com/send/$SC3_SENDKEY.send" || true

      # -------- 通知（失败） --------
      - name: Send notification (failure)
        if: failure()
        env:
          SC3_UID: ${{ secrets.SC3_UID }}
          SC3_SENDKEY: ${{ secrets.SC3_SENDKEY }}
        run: |
          sha="${{ needs.check.outputs.short_sha }}"
          actionsUrl="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="{\"title\":\"DSH 构建失败\",\"desp\":\"❌ DSH 构建失败 - 提交: $sha - 日志: $actionsUrl\"}"
          curl -sf -X POST -H "Content-Type: application/json" -d "$body" \
            "https://$SC3_UID.push.ft07.com/send/$SC3_SENDKEY.send" || true
